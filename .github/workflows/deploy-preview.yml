name: Deploy preview

on:
  push:
    branches: [develop]

# Queue preview deploys so two pushes never deploy over each other.
concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  verify-migrate-deploy:
    name: Verify, migrate, and deploy preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (runtime, types, typecheck, lint, tests, builds)
        run: npm run verify
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

      - name: Apply preview database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

      - name: Deploy preview API Worker
        run: npm run deploy:preview:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview web Worker
        run: npm run deploy:preview:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
